name: Build and Test Integration

on:
  push:
    branches: [ test/main ]
  pull_request:
    branches: [ test/main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies via CI
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit testing via Jest
        run: npm run test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies via CI
        run: npm ci

      - name: Build application
        run: npm run build